[project]
name = "vit-from-scratch"
version = "0.1.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "gradio>=4.0.0",
    "wandb>=0.16.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

# CUDA 12.1 wheels exist only for Linux/Windows; macOS falls back to PyPI (CPU/MPS)
[tool.uv]
# Keep macOS on the same torch minor version as the CUDA 12.1 wheels
constraint-dependencies = [
    "torch<2.6; sys_platform == 'darwin'",
    "torchvision<0.21; sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
